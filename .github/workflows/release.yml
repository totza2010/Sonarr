name: Release

# This fork's replacement for upstream's deploy.yml, which cannot run here: it declares
# SERVICES_API_KEY as a required secret, and a required secret that does not exist fails the calling
# workflow before any `if` is read. The packaging is upstream's, unchanged — it is the same action
# the official builds use. What is gone is the final step, which reports the build to
# services.sonarr.tv so their updater offers it. That service is theirs, and this fork's images and
# archives are not something it should be handing out.
#
# Release notes are left to GitHub rather than generated against the previous release the way
# upstream does, so the first run works on a repository that has no releases yet.
#
# The container image is built here too. Sonarr ships none of its own, so the recipe follows what
# linuxserver and hotio do - see docs/docker.md.

on:
  workflow_call:
    inputs:
      framework:
        description: '.net framework'
        type: string
        required: true
      branch:
        description: 'Git branch used for this build'
        type: string
        required: true
      major_version:
        description: 'Sonarr major version'
        type: string
        required: true
      version:
        description: 'Sonarr version'
        type: string
        required: true

jobs:
  # Everything this fork publishes lives here: the archives and installers, the release they hang
  # off, and the image. They all wait on the same tests and carry the same version, so keeping them
  # in one place is the only way that stays true.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      RUNTIME: linux-musl-x64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: build_linux
          path: _artifacts

      # The backend job builds without --frontend, so the UI ships as its own artifact.
      - name: Download UI
        uses: actions/download-artifact@v4
        with:
          name: build_ui
          path: _artifacts/${{ env.RUNTIME }}/${{ inputs.framework }}/Sonarr/UI

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags name the upstream release the image was built from, since that is what is worth knowing
      # about a fork. The version passed in is upstream's own with a build number on the end, and
      # `match` takes the upstream part back out of it, so nothing here has to be kept up to date by
      # hand:
      #
      #   4.0.19.812   this build, never moves
      #   4.0.19       newest build of that upstream release, default branch only
      #   latest       default branch only
      #   main         whichever branch this was
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sonarr
          tags: |
            type=raw,value=${{ inputs.version }}
            type=match,pattern=\d+\.\d+\.\d+,group=0,value=${{ inputs.version }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RUNTIME=${{ env.RUNTIME }}
            FRAMEWORK=${{ inputs.framework }}
            VERSION=${{ inputs.version }}
            REPOSITORY=${{ github.repository }}
            BRANCH=${{ inputs.branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package:
    strategy:
      matrix:
        platform: [freebsd, linux, macos, windows]
        include:
          - platform: freebsd
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: ubuntu-latest
          - platform: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          platform: ${{ matrix.platform }}
          artifact: build_${{ matrix.platform }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: release_*
          merge-multiple: true

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Sonarr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.branch != 'main' }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}
